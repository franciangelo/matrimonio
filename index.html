<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angelo & Francesca</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body{
      font-family: "Source Sans Pro", system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 300;
      color: #111;
    }

    /* Page background. This is what you will see "around" a contain-sized hero image. */
    html, body { background: #fff; }
    html { color-scheme: light; }

    /*
      IMPORTANT:
      If you use background-size: contain, the image will NOT fill the whole section.
      The remaining area will show the SECTION's background (or the page background if the section is transparent).
      To avoid a visible “boxed” look, we make #hero background transparent so it blends with the page.
    */

    /* ===================== NAV (DEFAULT = DESKTOP/TABLET) ===================== */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(6px);

      transition: opacity 200ms ease, transform 200ms ease;
    }

    nav.is-hidden {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .nav-left {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex: 1;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    nav a:hover { text-decoration: underline; }

    .lang-switch {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: flex-end;
      min-width: 120px;
    }

    .lang-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      color: #111;
      font-size: 1rem;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.4rem;
      border-radius: 6px;
    }

    .lang-btn[aria-pressed="true"] {
      background: rgba(0,0,0,0.08);
    }

    /* NEW: hamburger hidden by default (desktop/tablet) */
    .nav-toggle { display: none; }

    /* ===================== SECTIONS ===================== */
  /* ===================== SECTIONS ===================== */
section {
  min-height: 100vh;
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;

  /* Background image */
  background-image: url("background.jpg");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
}


    /* ===================== HERO (DEFAULT = DESKTOP/TABLET) ===================== */
    #hero {
      background-image: url("hero.png");
      background-repeat: no-repeat;
      background-color: #fff;
      background-size: auto 95%;
      background-position: 50% 50%;
    }

    /* ===================== PHONE ===================== */
    @media (max-width: 768px) {
      nav {
        background: transparent;
        backdrop-filter: none;
        padding: 0.75rem 1rem;
        align-items: flex-start;
      }

      nav a {
        font-size: 0.9rem;
        letter-spacing: 0.06em;
      }

      .nav-left {
        flex: 0 0 auto;
        width: fit-content;
        max-width: calc(100vw - 2rem);
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.75rem 0.9rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(6px);
      }

      /* NEW: phone-only hamburger button styling */
      .nav-toggle {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.08); /* slightly grey background */
        cursor: pointer;
        gap: 6px; /* clear separation between the three lines */
      }

      .nav-toggle .bar {
        display: block;
        width: 18px;
        height: 2px;
        background: #111;
        border-radius: 2px;
      }

      /* NEW: collapse menu on phone by default */
      .nav-left { display: none; }

      /* NEW: show menu only when nav is open */
      nav.is-open .nav-left { display: inline-flex; }

      #hero {
        background-size: 110% auto;
        background-position: 50% 45%;
      }
    }

    /* ===================== CONTENT ===================== */
    .content {
      max-width: 700px;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.85);
      text-align: center;
    }

    .content h2 { font-weight: 400; margin-bottom: 1rem; }
    .content h2 {
  font-family: "Caveat", cursive;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.05;
  font-size: 2.2rem;      /* mobile / base */
  margin-bottom: 1.2rem;
}

.content p {
  line-height: 1.6;
  font-size: 1.05rem;
  margin-bottom: 0.8rem;
}

.content p:last-child {
  margin-bottom: 0;
}

/* ===================== RICH SUBSECTIONS ===================== */
.rich { text-align: left; }
.rich p { margin: 0 0 0.85rem; }
.rich p:last-child { margin-bottom: 0; }

.subhead{
  font-weight: 600;
  letter-spacing: 0.02em;
  margin: 1.35rem 0 0.55rem;
  font-size: 1.35rem;   /* bigger on mobile + default */
  line-height: 1.25;
}

.bullets{
  margin: 0.35rem 0 0.9rem;
  padding-left: 1.15rem;
}
.bullets li{
  margin: 0.35rem 0;
  line-height: 1.55;
}

.note{
  margin-top: 1rem;
  padding: 0.9rem 1rem;
  border-radius: 14px;
  background: rgba(0,0,0,0.04);
}
.note strong{ font-weight: 600; }

.card{
  margin-top: 1.1rem;
  padding: 1.05rem 1.1rem;
  border-radius: 16px;
  background: rgba(0,0,0,0.03);
}
.card .title{
  font-weight: 600;
  margin-bottom: 0.45rem;
  font-size: 1.25rem;     /* bigger emoji-title */
  line-height: 1.25;
}
.meta{
  font-size: 0.98rem;
  opacity: 0.9;
  margin-bottom: 0.25rem;
}
.small{
  font-size: 0.98rem;
  opacity: 0.95;
}

@media (min-width: 769px) {
  .subhead { font-size: 1.6rem; }
  .note, .card { padding: 1.1rem 1.25rem; }
}
@media (min-width: 769px) {
  .card .title { font-size: 1.45rem; }
}

    @media (min-width: 769px) {
      .content h2 { font-size: 2.8rem; }
      .content p { font-size: 1.35rem; line-height: 1.75; }
    }

    .dark .content {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- NAV -->
  <nav id="site-nav">
    <!-- NEW: hamburger button (only visible on phone) -->
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <div class="nav-left" id="nav-menu">
      <a href="#hero" data-i18n="nav.home">Home</a>
      <a href="#details" data-i18n="nav.details">Dettagli</a>
      <a href="#travel" data-i18n="nav.travel">Come arrivare</a>
      <a href="#accommodation" data-i18n="nav.accommodation">Dove alloggiare</a>
      <a href="#gift" data-i18n="nav.gift">Regalo di nozze</a>
      <a href="#rsvp" data-i18n="nav.rsvp">RSVP</a>
    </div>

    <div class="lang-switch">
      <button class="lang-btn" data-lang="it" aria-pressed="true">IT</button>
      <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero"></section>

  <section id="details">
    <div class="content">
      <h2 data-i18n="details.title">Dettagli</h2>
      <div class="rich" data-i18n="details.body"></div>
    </div>
  </section>

  <section id="travel">
    <div class="content">
      <h2 data-i18n="travel.title">Come arrivare</h2>
      <div class="rich" data-i18n="travel.body"></div>
    </div>
  </section>

  <section id="accommodation">
    <div class="content">
      <h2 data-i18n="accommodation.title">Dove alloggiare</h2>
      <div class="rich" data-i18n="accommodation.body"></div>
    </div>
  </section>

  <section id="gift">
    <div class="content">
      <h2 data-i18n="gift.title">Regalo di nozze</h2>
      <p data-i18n="common.comingSoon"></p>
    </div>
  </section>

  <section id="rsvp" class="dark">
    <div class="content">
      <h2 data-i18n="rsvp.title">RSVP</h2>
      <p data-i18n="common.comingSoon"></p>
    </div>
  </section>

  <script>
    (function () {
      const translations = {
        it: {
          "nav.home": "Home",
          "nav.details": "Dettagli",
          "nav.travel": "Come arrivare",
          "nav.accommodation": "Dove alloggiare",
          "nav.gift": "Regalo di nozze",
          "nav.rsvp": "Conferma di partecipazione",

          "details.title": "Dettagli",
          "details.body": `
            <p>Con immensa gioia, siamo lieti di invitarvi al nostro matrimonio per celebrare insieme l'amore che ci unisce.</p>
            <p>Il <strong>6 giugno 2026</strong> la celebrazione si terrà nella <a href='https://maps.app.goo.gl/tNNDYr8jV97CAnNj8' target='_blank'>Chiesa Parrocchiale di San Bernardo Abate</a> (Frazione Roata Chiusani, Centallo CN) alle <strong>10:30</strong>.</p>
            <p>I festeggiamenti proseguiranno alla <a href='https://maps.app.goo.gl/cNHu2r9WH1EdeGcu7' target='_blank'>Locanda Fungo Reale</a> (Via Fontana Canonica, Frazione Airale, 7/bis, Valloriate CN).</p>
          `,

          "travel.title": "Come arrivare",
          "travel.body": `
            <h3 class="subhead">✈️ In aereo</h3>
            <p>L’aeroporto più vicino è <strong>Torino Caselle (TRN)</strong>, consigliato per comodità. <strong>Milano Malpensa (MXP)</strong> è un’alternativa possibile, ma decisamente più distante.</p>
            <p>Da Torino Caselle vi suggeriamo di <strong>noleggiare un’auto</strong>, la soluzione più pratica per raggiungere Cuneo, gli alloggi e la location del matrimonio.</p>
            <p class="small"><strong>Percorso in auto da Torino Caselle:</strong> Tangenziale (A55) in direzione A6 – Savona. Proseguire fino all’uscita <strong>Fossano</strong>, quindi seguire le strade statali/regionali verso <strong>Cuneo</strong> / centro valle secondo la destinazione del vostro alloggio o della cerimonia.</p>

            <h3 class="subhead">🚆 In treno</h3>
            <p>Da <strong>Torino Porta Nuova</strong> partono treni regionali per <strong>Cuneo</strong> / <strong>Centallo</strong>, diretti o con cambio a <strong>Fossano</strong>. Una volta arrivati, sarà necessario proseguire in auto, poiché la chiesa e la location non sono raggiungibili con i mezzi pubblici.</p>

            <h3 class="subhead">🚙 In auto</h3>
            <p>Se viaggiate in auto, sarà sufficiente seguire le indicazioni di Google Maps verso la chiesa, la location o il vostro alloggio.</p>

            <div class="note">
              <p><strong>ℹ️ Nota utile</strong><br/>Per gli spostamenti durante il giorno e il weekend del matrimonio, l’auto è fortemente consigliata.</p>
              <p><strong>✔️ Car pooling</strong><br/>Se volete organizzare car pooling, possiamo aiutarvi a mettere in contatto gli ospiti che arrivano in orari simili. Abbiamo organizzato una chat WhatsApp dedicata <a href="https://chat.whatsapp.com/Bz5fbI0YoHd1spNRrWpS1a" target="_blank">qui</a>.</p>
            </div>
          `,
          "accommodation.title": "Dove alloggiare",
          "accommodation.body": `
            <p>Avete due opzioni:</p>

            <div class="card">
              <div class="title">🌿 Dormire in valle</div>
              <p class="meta"><strong>Locanda Fungo Reale</strong> · 📍 Presso la location del matrimonio</p>
              <p class="small"><a href='https://www.locandafungoreale.it' target='_blank'>www.locandafungoreale.it</a></p>
              <p>Una locanda accogliente immersa nella tranquillità della valle, perfetta per chi desidera soggiornare vicino al luogo dei festeggiamenti e godersi appieno il weekend.</p>
              <p class="small"><strong>Nota:</strong> se desiderate pernottare presso la Locanda Fungo Reale, vi chiediamo di comunicarcelo: ci occuperemo noi direttamente della prenotazione.</p>
            </div>

            <div class="card">
              <div class="title">🏙️ Dormire a Cuneo (città)</div>
              <p>Per chi preferisce soggiornare in città, Cuneo offre diverse soluzioni alberghiere e B&amp;B, facilmente raggiungibili in auto dalla location del matrimonio e comode per muoversi in autonomia.</p>
              <p class="small">Vi consigliamo di prenotare con anticipo e di scegliere la struttura più adatta alle vostre esigenze.</p>
            </div>
          `,
          "gift.title": "Regalo di nozze",
          "rsvp.title": "Conferma di partecipazione",

          "common.comingSoon": "Maggiori informazioni arriveranno presto."
        },
        en: {
          "nav.home": "Home",
          "nav.details": "Details",
          "nav.travel": "Travel",
          "nav.accommodation": "Accommodation",
          "nav.gift": "Wedding gift",
          "nav.rsvp": "RSVP",

          "details.title": "Details",
          "details.body": `
            <p>With immense joy, we are delighted to invite you to our wedding to celebrate together the love that unites us.</p>
            <p>On <strong>June 6, 2026</strong>, the ceremony will take place at the <a href='https://maps.app.goo.gl/tNNDYr8jV97CAnNj8' target='_blank'>Parish Church of San Bernardo Abate</a> (Roata Chiusani hamlet, Centallo CN) at <strong>10:30</strong>.</p>
            <p>Celebrations will continue at <a href='https://maps.app.goo.gl/cNHu2r9WH1EdeGcu7' target='_blank'>Locanda Fungo Reale</a> (Via Fontana Canonica, Frazione Airale 7/bis, Valloriate CN).</p>
          `,

          "travel.title": "Travel",
          "travel.body": `
            <h3 class="subhead">✈️ By plane</h3>
            <p>The closest airport is <strong>Turin Caselle (TRN)</strong>, recommended for convenience. <strong>Milan Malpensa (MXP)</strong> is a possible alternative, but significantly farther away.</p>
            <p>From Turin Caselle we suggest <strong>renting a car</strong>, which is the most practical way to reach Cuneo, your accommodation, and the wedding venues.</p>
            <p class="small"><strong>Driving route from Turin Caselle:</strong> Take the ring road (A55) towards the A6 – Savona. Continue to the <strong>Fossano</strong> exit, then follow state/regional roads towards <strong>Cuneo</strong> / the valley area depending on your accommodation or the ceremony.</p>

            <h3 class="subhead">🚆 By train</h3>
            <p>From <strong>Torino Porta Nuova</strong> there are regional trains to <strong>Cuneo</strong> / <strong>Centallo</strong>, direct or with a change in <strong>Fossano</strong>. Once you arrive, you will need a car, as the church and the reception venue cannot be reached by public transport.</p>

            <h3 class="subhead">🚙 By car</h3>
            <p>If you are driving, simply follow Google Maps directions to the church, the venue, or your accommodation.</p>

            <div class="note">
              <p><strong>ℹ️ Useful note</strong><br/>For getting around on the wedding day and weekend, a car is strongly recommended.</p>
              <p><strong>✔️ Car pooling</strong><br/>If you would like to arrange car pooling, we can help connect guests arriving at similar times. We created a dedicated WhatsApp chat <a href="https://chat.whatsapp.com/Bz5fbI0YoHd1spNRrWpS1a" target="_blank">here</a>.</p>
            </div>
          `,
          "accommodation.title": "Accommodation",
          "accommodation.body": `
            <p>There are two main options:</p>

            <div class="card">
              <div class="title">🌿 Stay in the valley</div>
              <p class="meta"><strong>Locanda Fungo Reale</strong> · 📍 At the wedding venue</p>
              <p class="small"><a href='https://www.locandafungoreale.it' target='_blank'>www.locandafungoreale.it</a></p>
              <p>A welcoming inn in the quiet of the valley, ideal if you want to stay close to the celebrations and fully enjoy the weekend.</p>
              <p class="small"><strong>Note:</strong> if you would like to stay at Locanda Fungo Reale, please let us know—we will handle the booking directly.</p>
            </div>

            <div class="card">
              <div class="title">🏙️ Stay in Cuneo (city)</div>
              <p>If you prefer staying in town, Cuneo offers many hotel and B&amp;B options. They are easy to reach by car from the reception venue and convenient for moving around independently.</p>
              <p class="small">We recommend booking early and choosing the option that best fits your needs.</p>
            </div>
          `,
          "gift.title": "Wedding gift",
          "rsvp.title": "RSVP",

          "common.comingSoon": "More information coming soon."
        }
      };

      const buttons = document.querySelectorAll(".lang-btn");
      const nodes = document.querySelectorAll("[data-i18n]");

      function setLanguage(lang) {
        document.documentElement.lang = lang;
        nodes.forEach(n => {
          const key = n.dataset.i18n;
          if (translations[lang][key]) n.innerHTML = translations[lang][key];
        });
        buttons.forEach(b =>
          b.setAttribute("aria-pressed", b.dataset.lang === lang)
        );
        localStorage.setItem("wedding_lang", lang);
      }

      buttons.forEach(b => b.onclick = () => setLanguage(b.dataset.lang));
      setLanguage(localStorage.getItem("wedding_lang") || "it");

      const nav = document.getElementById("site-nav");
      const hero = document.getElementById("hero");

      const observer = new IntersectionObserver(
        ([e]) => nav.classList.toggle("is-hidden", !e.isIntersecting),
        { threshold: 0.02 }
      );
      observer.observe(hero);

      /* NEW: Phone hamburger menu toggle (no effect on desktop because button is hidden) */
      const toggle = document.getElementById("nav-toggle");
      const menu = document.getElementById("nav-menu");

      toggle.addEventListener("click", () => {
        const isOpen = nav.classList.toggle("is-open");
        toggle.setAttribute("aria-expanded", String(isOpen));
      });

      /* Close menu after clicking a link (phone) */
      menu.querySelectorAll("a").forEach(a => {
        a.addEventListener("click", () => {
          nav.classList.remove("is-open");
          toggle.setAttribute("aria-expanded", "false");
        });
      });
    })();
  </script>
</body>
</html>
