<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angelo & Francesca</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111;
    }

    /* Page background. This is what you will see "around" a contain-sized hero image. */
    html, body { background: #fff; }
    html { color-scheme: light; }

    /*
      IMPORTANT:
      If you use background-size: contain, the image will NOT fill the whole section.
      The remaining area will show the SECTION's background (or the page background if the section is transparent).
      To avoid a visible “boxed” look, we make #hero background transparent so it blends with the page.
    */

    /* ===================== NAV (DEFAULT = DESKTOP/TABLET) ===================== */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(6px);

      transition: opacity 200ms ease, transform 200ms ease;
    }

    nav.is-hidden {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .nav-left {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex: 1;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    nav a:hover { text-decoration: underline; }

    .lang-switch {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: flex-end;
      min-width: 120px;
    }

    .lang-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      color: #111;
      font-size: 1rem;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.4rem;
      border-radius: 6px;
    }

    .lang-btn[aria-pressed="true"] {
      background: rgba(0,0,0,0.08);
    }

    /* Hamburger button is hidden by default (desktop/tablet) */
    .nav-toggle { display: none; }

    /* ===================== SECTIONS ===================== */
    section {
      min-height: 100vh;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    /* ===================== HERO (DEFAULT = DESKTOP/TABLET) ===================== */
    #hero {
      background-image: url("hero.png");
      background-repeat: no-repeat;
      background-color: #fff;
      background-size: auto 95%;
      background-position: 50% 50%;
    }

    /* ===================== PHONE ===================== */
    @media (max-width: 768px) {
      nav {
        background: transparent;
        backdrop-filter: none;
        padding: 0.75rem 1rem;
        align-items: flex-start;
      }

      nav a {
        font-size: 0.9rem;
        letter-spacing: 0.06em;
      }

      .nav-left {
        flex: 0 0 auto;
        width: fit-content;
        max-width: calc(100vw - 2rem);
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.75rem 0.9rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(6px);
      }

      /* Phone-only: show hamburger button */
      .nav-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(6px);
        cursor: pointer;
      }

      .nav-toggle .bar {
        display: block;
        width: 22px;
        height: 2px;
        background: #111;
        margin: 4px 0;
      }

      /* Phone-only: menu collapsed by default */
      .nav-left { display: none; }

      /* Phone-only: menu visible when nav is open */
      nav.is-open .nav-left { display: inline-flex; }

      #hero {
        background-size: 110% auto;
        background-position: 50% 45%;
      }
    }

    /* ===================== CONTENT ===================== */
    .content {
      max-width: 700px;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.85);
      text-align: center;
    }

    .content h2 { font-weight: 400; margin-bottom: 1rem; }
    .content p { line-height: 1.6; font-size: 1.05rem; }

    @media (min-width: 769px) {
      .content h2 { font-size: 2rem; }
      .content p { font-size: 1.35rem; line-height: 1.75; }
    }

    .dark .content {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- NAV -->
  <nav id="site-nav">
    <!-- Phone hamburger (hidden on desktop/tablet) -->
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <div class="nav-left" id="nav-menu">
      <a href="#hero" data-i18n="nav.home">Home</a>
      <a href="#details" data-i18n="nav.details">Dettagli</a>
      <a href="#travel" data-i18n="nav.travel">Come arrivare</a>
      <a href="#accommodation" data-i18n="nav.accommodation">Dove alloggiare</a>
      <a href="#gift" data-i18n="nav.gift">Regalo di nozze</a>
      <a href="#rsvp" data-i18n="nav.rsvp">RSVP</a>
    </div>

    <div class="lang-switch">
      <button class="lang-btn" data-lang="it" aria-pressed="true">IT</button>
      <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero"></section>

  <section id="details">
    <div class="content">
      <h2 data-i18n="details.title">Dettagli</h2>
      <p data-i18n="details.ceremony"></p>
      <p data-i18n="details.lunch"></p>
    </div>
  </section>

  <section id="travel">
    <div class="content">
      <h2 data-i18n="travel.title">Come arrivare</h2>
      <p data-i18n="common.comingSoon"></p>
    </div>
  </section>

  <section id="accommodation">
    <div class="content">
      <h2 data-i18n="accommodation.title">Dove alloggiare</h2>
      <p data-i18n="common.comingSoon"></p>
    </div>
  </section>

  <section id="gift">
    <div class="content">
      <h2 data-i18n="gift.title">Regalo di nozze</h2>
      <p data-i18n="common.comingSoon"></p>
    </div>
  </section>

  <section id="rsvp" class="dark">
    <div class="content">
      <h2 data-i18n="rsvp.title">RSVP</h2>
      <p data-i18n="common.comingSoon"></p>
    </div>
  </section>

  <script>
    (function () {
      const translations = {
        it: {
          "nav.home": "Home",
          "nav.details": "Dettagli",
          "nav.travel": "Come arrivare",
          "nav.accommodation": "Dove alloggiare",
          "nav.gift": "Regalo di nozze",
          "nav.rsvp": "RSVP",

          "details.title": "Dettagli",
          "details.ceremony":
            "La cerimonia si terrà presso la <a href='https://maps.app.goo.gl/tNNDYr8jV97CAnNj8' target='_blank'>chiesa di Roata Chiusani</a> il 6 giugno alle ore 10:30.",
          "details.lunch":
            "Il pranzo seguirà presso la <a href='https://maps.app.goo.gl/cNHu2r9WH1EdeGcu7' target='_blank'>Locanda Fungo Reale</a>.",

          "travel.title": "Come arrivare",
          "accommodation.title": "Dove alloggiare",
          "gift.title": "Regalo di nozze",
          "rsvp.title": "RSVP",

          "common.comingSoon": "Maggiori informazioni arriveranno presto."
        },
        en: {
          "nav.home": "Home",
          "nav.details": "Details",
          "nav.travel": "Travel",
          "nav.accommodation": "Accommodation",
          "nav.gift": "Wedding gift",
          "nav.rsvp": "RSVP",

          "details.title": "Details",
          "details.ceremony":
            "The ceremony will take place at the <a href='https://maps.app.goo.gl/tNNDYr8jV97CAnNj8' target='_blank'>church of Roata Chiusani</a> on June 6 at 10:30am.",
          "details.lunch":
            "Lunch will follow at <a href='https://maps.app.goo.gl/cNHu2r9WH1EdeGcu7' target='_blank'>Locanda Fungo Reale</a>.",

          "travel.title": "Travel",
          "accommodation.title": "Accommodation",
          "gift.title": "Wedding gift",
          "rsvp.title": "RSVP",

          "common.comingSoon": "More information coming soon."
        }
      };

      const buttons = document.querySelectorAll(".lang-btn");
      const nodes = document.querySelectorAll("[data-i18n]");

      function setLanguage(lang) {
        document.documentElement.lang = lang;
        nodes.forEach(n => {
          const key = n.dataset.i18n;
          if (translations[lang][key]) n.innerHTML = translations[lang][key];
        });
        buttons.forEach(b =>
          b.setAttribute("aria-pressed", b.dataset.lang === lang)
        );
        localStorage.setItem("wedding_lang", lang);
      }

      buttons.forEach(b => b.onclick = () => setLanguage(b.dataset.lang));
      setLanguage(localStorage.getItem("wedding_lang") || "it");

      const nav = document.getElementById("site-nav");
      const hero = document.getElementById("hero");

      const observer = new IntersectionObserver(
        ([e]) => nav.classList.toggle("is-hidden", !e.isIntersecting),
        { threshold: 0.02 }
      );
      observer.observe(hero);

      /* Phone hamburger menu toggle */
      const toggle = document.getElementById("nav-toggle");
      const menu = document.getElementById("nav-menu");

      function setOpen(isOpen) {
        nav.classList.toggle("is-open", isOpen);
        toggle.setAttribute("aria-expanded", String(isOpen));
      }

      toggle.addEventListener("click", () => {
        setOpen(!nav.classList.contains("is-open"));
      });

      /* Close menu after clicking a link (phone) */
      menu.querySelectorAll("a").forEach(a => {
        a.addEventListener("click", () => setOpen(false));
      });

      /* If viewport grows beyond phone, ensure menu state resets */
      window.addEventListener("resize", () => {
        if (window.matchMedia("(min-width: 769px)").matches) setOpen(false);
      });
    })();
  </script>
</body>
</html>
