<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angelo & Francesca</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
            color: #111;
        }

        /* Top navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;

            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
        }

        nav a {
            text-decoration: none;
            color: #111;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Generic full-screen section */
        section {
            min-height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }

        /* Empty hero section */
        #hero {
            background-image: url("hero.jpeg");
        }

        /* Example content sections */
        .content {
            max-width: 700px;
            background: rgba(255, 255, 255, 0.85);
            padding: 2.5rem;
            text-align: center;
        }

        .content h2 {
            font-weight: 400;
            margin-bottom: 1rem;
        }

        .content p {
            line-height: 1.6;
        }

        /* Optional darker overlay variant */
        .dark .content {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#hero">Home</a>
        <a href="#details">Details</a>
        <a href="#travel">Travel</a>
        <a href="#rsvp">RSVP</a>
    </nav>

    <!-- Hero (empty, background only) -->
    <section id="hero"></section>

    <!-- Section with another background figure -->
    <section id="details" style="background-image: url('details.jpeg');">
        <div class="content">
            <h2>Details</h2>
            <p>
                Ceremony and reception information can go here.
            </p>
        </div>
    </section>

    <!-- Section without background image -->
    <section id="travel">
        <div class="content">
            <h2>Travel</h2>
            <p>
                Travel and accommodation details.
            </p>
        </div>
    </section>

    <!-- Dark section with background -->
    <section id="rsvp" class="dark" style="background-image: url('rsvp.jpeg');">
        <div class="content">
            <h2>RSVP</h2>
            <p>
                RSVP instructions or link.
            </p>
        </div>
    </section>

</body>
</html>
