<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angelo & Francesca</title>

  <style>
    /* ---- Reset ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #000;
      background: #fff;
    }

    /* ---- Fixed top nav ---- */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    nav a {
      text-decoration: none;
      color: #000;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    nav a:hover { opacity: 0.65; }

    /* ---- Sections ---- */
    section {
      min-height: 100vh;
      padding: 64px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fff;
    }

    /* ---- Hero illustration ---- */
    .hero-figure {
      margin-top: 64px; /* keep clear of fixed nav */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image {
      max-height: 82vh;
      max-width: min(92vw, 900px);
      object-fit: contain;
      display: block;
    }

    /* ---- Content blocks ---- */
    .content {
      max-width: 720px;
      padding: 28px 22px;
    }

    h2 {
      font-size: 2rem;
      font-weight: 350;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .divider {
      width: min(720px, 92vw);
      height: 1px;
      background: rgba(0,0,0,0.08);
      margin: 18px auto 0;
    }

    /* ---- Mobile ---- */
    @media (max-width: 600px) {
      nav { gap: 16px; }
      h2 { font-size: 1.5rem; }
      p { font-size: 1.0rem; }
      .hero-image { max-height: 74vh; }
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav>
    <a href="#home">Home</a>
    <a href="#story">Our Story</a>
    <a href="#details">Details</a>
    <a href="#rsvp">RSVP</a>
  </nav>

  <!-- HERO -->
  <section id="home">
    <div class="hero-figure">
      <img src="hero.jpeg" alt="Wedding illustration" class="hero-image" />
    </div>
  </section>

  <!-- STORY -->
  <section id="story">
    <div class="content">
      <h2>Our Story</h2>
      <p>
        Write a short paragraph here describing how you met or what you would
        like your guests to know.
      </p>
      <div class="divider"></div>
    </div>
  </section>

  <!-- DETAILS -->
  <section id="details">
    <div class="content">
      <h2>Details</h2>
      <p>
        Ceremony and reception information goes here: location, time,
        dress code, and travel notes.
      </p>
      <div class="divider"></div>
    </div>
  </section>

  <!-- RSVP -->
  <section id="rsvp">
    <div class="content">
      <h2>RSVP</h2>
      <p>
        Add an email address or a link to a form.
      </p>
      <div class="divider"></div>
    </div>
  </section>

</body>
</html>
