<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angelo & Francesca</title>

  <style>
    /* ---- Reset ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #000;
      background: #fff;
      overflow-x: hidden;
    }

    /* ---- Fixed top nav ---- */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: rgba(255, 255, 255, 0.95);
      z-index: 1000;

      border-bottom: none;
      backdrop-filter: none;
    }

    nav a {
      text-decoration: none;
      color: #000;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    nav a:hover { opacity: 0.65; }

    /* ---- Sections ---- */
    section {
      min-height: 100vh;
      padding: 64px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #fff;
    }

    /* HERO */
    #home {
      padding: 0;
      background-image: url("./hero.jpeg");
      background-color: #fff;
      position: relative;
      overflow: hidden;
    }

    #story   { background-image: url("./story.jpeg"); }
    #details { background-image: url("./details.jpeg"); }
    #rsvp    { background-image: url("./rsvp.jpeg"); }

    /* ---- Desktop framing (halo/contour fix) ---- */
    @media (min-width: 900px) {
      #home {
        background-image: none;
      }

      #home::before {
        content: "";
        position: absolute;

        /* overscan instead of clip-path */
        top: -3px;
        right: -3px;
        bottom: -3px;
        left: -3px;

        background: #ffffff url("./hero.jpeg") no-repeat;
        background-size: 90%;
        background-position: center 80%;

        transform: translateZ(0);
        backface-visibility: hidden;
        will-change: transform;
      }
    }

    /* ---- Content blocks ---- */
    .content {
      max-width: 720px;
      padding: 28px 22px;
      background: rgba(255, 255, 255, 0.78);
    }

    h2 {
      font-size: 2rem;
      font-weight: 350;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .divider {
      width: min(720px, 92vw);
      height: 1px;
      background: rgba(0,0,0,0.08);
      margin: 18px auto 0;
    }

    /* ---- Mobile ---- */
    @media (max-width: 600px) {
      nav { gap: 16px; }
      h2 { font-size: 1.5rem; }
      p  { font-size: 1.0rem; }
      .content { padding: 22px 18px; }
    }
  </style>
</head>

<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#story">Our Story</a>
    <a href="#details">Details</a>
    <a href="#rsvp">RSVP</a>
  </nav>

  <section id="home"></section>

  <section id="story">
    <div class="content">
      <h2>Our Story</h2>
      <p>A short paragraph about how you met.</p>
      <div class="divider"></div>
    </div>
  </section>

  <section id="details">
    <div class="content">
      <h2>Details</h2>
      <p>Ceremony and reception information.</p>
      <div class="divider"></div>
    </div>
  </section>

  <section id="rsvp">
    <div class="content">
      <h2>RSVP</h2>
      <p>
        <a href="https://example.com" style="color:#000; text-decoration: underline;">
          RSVP form
        </a>
      </p>
    </div>
  </section>

</body>
</html>
