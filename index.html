<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angelo & Francesca</title>

    <style>
        /* =====================================================
           GLOBAL RESET
        ===================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;

            display: flex;
            justify-content: center;
            gap: 2rem;

            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
        }

        nav a {
            text-decoration: none;
            color: #111;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* =====================================================
           SECTIONS
        ===================================================== */
        section {
            min-height: 100vh;
            width: 100%;

            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }

        /* =====================================================
           HERO SECTION
           Control vertical crop here
           0%   = top
           50%  = center
           100% = bottom
        ===================================================== */
        :root {
            --hero-focus-y-mobile: 50%;
            --hero-focus-y-desktop: 80%;
        }

        #hero {
            background-image: url("hero.jpeg");
            background-position: 50% var(--hero-focus-y-mobile);
        }

        @media (min-width: 768px) {
            #hero {
                background-position: 50% var(--hero-focus-y-desktop);
            }
        }

        /* =====================================================
           CONTENT BLOCKS (OPTIONAL)
        ===================================================== */
        .content {
            max-width: 700px;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.85);
            text-align: center;
        }

        .content h2 {
            font-weight: 400;
            margin-bottom: 1rem;
        }

        .content p {
            line-height: 1.6;
        }

        .dark .content {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- ================= NAV ================= -->
    <nav>
        <a href="#hero">Home</a>
        <a href="#details">Details</a>
        <a href="#travel">Travel</a>
        <a href="#rsvp">RSVP</a>
    </nav>

    <!-- ================= HERO (IMAGE ONLY) ================= -->
    <section id="hero"></section>

    <!-- ================= SECTIONS ================= -->
    <section id="details" style="background-image: url('details.jpeg');">
        <div class="content">
            <h2>Details</h2>
            <p>Event information can go here.</p>
        </div>
    </section>

    <section id="travel">
        <div class="content">
            <h2>Travel</h2>
            <p>Travel and accommodation information.</p>
        </div>
    </section>

    <section id="rsvp" class="dark" style="background-image: url('rsvp.jpeg');">
        <div class="content">
            <h2>RSVP</h2>
            <p>RSVP instructions or link.</p>
        </div>
    </section>

</body>
</html>
