<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding</title>

    <style>
        /* ---- Reset ---- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #000;
        }

        /* ---- Navigation ---- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(6px);
            z-index: 1000;
        }

        nav a {
            text-decoration: none;
            color: #000;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.65;
        }

        /* ---- Sections ---- */
        section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 64px 24px;
            text-align: center;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ---- Background images ---- */
        #hero {
            background-image: url("./hero.jpeg");
        }

        #story {
            background-image: url("./story.jpeg"); /* optional */
        }

        #details {
            background-image: url("./details.jpeg"); /* optional */
        }

        /* ---- Content box ---- */
        .overlay {
            max-width: 720px;
            background: rgba(255, 255, 255, 0.75);
            padding: 48px 32px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* ---- Mobile ---- */
        @media (max-width: 600px) {
            nav {
                gap: 16px;
            }

            h1 {
                font-size: 2.2rem;
            }

            h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#hero">Home</a>
        <a href="#story">Our Story</a>
        <a href="#details">Details</a>
    </nav>

    <!-- Hero -->
    <section id="hero">
        <div class="overlay">
            <h1>Alex & Jordan</h1>
            <p>September 21, 2026</p>
        </div>
    </section>

    <!-- Story -->
    <section id="story">
        <div class="overlay">
            <h2>Our Story</h2>
            <p>
                A few lines about how you met, where you are now,
                or whatever you want to share.
            </p>
        </div>
    </section>

    <!-- Details -->
    <section id="details">
        <div class="overlay">
            <h2>Details</h2>
            <p>
                Location, schedule, dress code, or a short message
                for your guests.
            </p>
        </div>
    </section>

</body>
</html>
